{{ template "head" . }}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Data Kursus</h1><a class="btn btn-primary" href="/kursus/tambah">Tambah Kursus</a></div>
<table class="table table-bordered table-striped bg-white shadow-sm"><thead class="table-dark"><tr><th>ID</th><th>Nama Kursus</th><th>Bidang</th><th>Aksi</th></tr></thead><tbody>
{{ range .kursus }}<tr><td>{{ .IDKursus }}</td><td>{{ .NamaKursus }}</td><td>{{ namaBidang .IDBidang }}</td><td><form action="/kursus/hapus/{{ .IDKursus }}" method="POST" onsubmit="return confirm('Hapus kursus?')"><button class="btn btn-sm btn-danger">Hapus</button></form></td></tr>{{ else }}<tr><td colspan="4" class="text-center text-muted">Belum ada data</td></tr>{{ end }}
</tbody></table>
{{ template "foot" . }}
